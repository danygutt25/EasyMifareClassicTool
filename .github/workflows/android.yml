name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a Gradle
        working-directory: "Mifare Classic Tool"
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: "Mifare Classic Tool"
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyMifareClassicTool-debug
          path: "Mifare Classic Tool/app/build/outputs/apk/debug/app-debug.apk"
